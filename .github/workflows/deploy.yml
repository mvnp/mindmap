name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Evita dois deploys simultâneos
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_REMOTE_HOST }} >> ~/.ssh/known_hosts

      # Envia só o código. O .env (SMTP, APP_URL) fica no servidor e o banco SQLite
      # vive no volume Docker "mindmap-data", então nenhum dos dois é tocado.
      - name: Sync files with Rsync
        run: |
          rsync -rlzv --delete \
            --rsync-path="sudo rsync" \
            --chown=${{ secrets.EC2_REMOTE_USER }}:${{ secrets.EC2_REMOTE_USER }} \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '!.env.example' \
            --exclude 'mindmap.db*' \
            ./ ${{ secrets.EC2_REMOTE_USER }}@${{ secrets.EC2_REMOTE_HOST }}:${{ secrets.EC2_TARGET_DIR }}

      - name: Rebuild and restart container
        run: |
          ssh ${{ secrets.EC2_REMOTE_USER }}@${{ secrets.EC2_REMOTE_HOST }} \
            "cd ${{ secrets.EC2_TARGET_DIR }} && docker compose up -d --build && docker image prune -f"
