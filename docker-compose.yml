name: mindmap

services:
  mindmap:
    build: .
    image: mindmap
    container_name: mindmap
    restart: unless-stopped
    env_file:
      - path: .env          # MYSMTP_* e APP_URL (veja .env.example); o arquivo não vai para o git
        required: false
    ports:
      - "${PORT:-3000}:3000"   # mude com: PORT=8080 docker compose up -d
    volumes:
      - mindmap-data:/data     # banco SQLite (mindmap.db) persistido

volumes:
  mindmap-data:
